name: SonarCloud

# Análise CI-based do SonarCloud (scan de qualidade + cobertura de testes).
# Substitui a Automatic Analysis — que DEVE ser desligada no dashboard, senão o
# scan do CI é rejeitado. Requer o secret SONAR_TOKEN (SonarCloud → My Account →
# Security → Generate Token, escopo do projeto).
#
# Este workflow também roda a suíte JS (Vitest) e Python (pytest) para gerar a
# cobertura — ou seja, um teste quebrado passa a REPROVAR o PR aqui. Se preferir
# que a cobertura não bloqueie, marque `continue-on-error: true` nos passos de
# cobertura.
on:
  push:
    branches: [main, Features]
  pull_request:
    branches: [main]

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scan + cobertura
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Sonar precisa do histórico completo para blame / cálculo de new code.
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # nunca 24 (next dev crasha o worker)
          cache: npm

      # Lockfile único na raiz do monorepo (npm workspaces).
      - name: Instalar dependências
        run: npm ci

      # Provider de cobertura do Vitest 4. Instalado sem alterar o lockfile
      # (--no-save) para não versionar churn; a versão é presa à do vitest.
      - name: Instalar provider de cobertura do Vitest
        run: npm i --no-save @vitest/coverage-v8@4.1.9

      # O supabaseClient.ts LANÇA no import se VITE_SUPABASE_* faltarem, e a suíte
      # do frontend-vite importa serviços que o usam. Os testes não batem no
      # Supabase (mockam os serviços), então placeholders bastam. Mesmo padrão do
      # workflow a11y.yml.
      - name: Configurar .env do frontend-vite
        working-directory: apps/frontend-vite
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'anon-key-placeholder' }}" >> .env

      # lcov por workspace → apps/<x>/coverage/lcov.info (ver sonar-project.properties).
      - name: Cobertura JS (Vitest → lcov)
        run: |
          npm run test --workspace=apps/frontend-vite -- --coverage --coverage.provider=v8 --coverage.reporter=lcov
          npm run test --workspace=apps/api-backend  -- --coverage --coverage.provider=v8 --coverage.reporter=lcov
          npm run test --workspace=apps/portal-next   -- --coverage --coverage.provider=v8 --coverage.reporter=lcov

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar deps Python (runtime + teste)
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          pip install -r requirements-dev.txt

      # coverage.xml na raiz (ver sonar-project.properties). skills tem pastas com
      # hífen (não são pacotes) — o pytest-cov trata os alvos como CAMINHOS.
      - name: Cobertura Python (pytest → coverage.xml)
        run: pytest tests/ --cov=server --cov=skills --cov=scripts --cov-report=xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
