name: Acessibilidade (a11y)

# Roda a camada de acessibilidade em navegador real (Playwright + axe) do
# frontend-vite a cada PR e em push na branch de desenvolvimento. Resolve o
# "teto" do ambiente local: o runner do GitHub tem Chromium com recursos
# normais, então o render pesado da SPA não derruba o renderer.
on:
  # Execução MANUAL (Actions → Acessibilidade (a11y) → Run workflow). Existe para verificar uma
  # troca de credencial do CI — usuário do e2e, grupo, permissão — sem esperar o próximo PR: essa
  # dependência já apareceu duas vezes (remoção do usuário sentinela e o gate do chat por grupo da
  # migration 120), e as duas foram descobertas depois, no PR seguinte.
  workflow_dispatch:
    inputs:
      require_protected:
        description: 'Falhar se as rotas protegidas não puderem ser escaneadas (secrets ausentes)'
        type: boolean
        default: true
  pull_request:
    paths:
      - 'apps/frontend-vite/**'
      - 'packages/shared/**'
      - '.github/workflows/a11y.yml'
  push:
    branches: [Features]
    paths:
      - 'apps/frontend-vite/**'
      - 'packages/shared/**'
      - '.github/workflows/a11y.yml'

# Cancela execuções antigas do mesmo ref quando um novo push chega.
concurrency:
  group: a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: axe em navegador (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 🔴 Sem os secrets, o bloco das rotas protegidas é PULADO pelo `test.skip` do spec — e
      # "pulado" num log de CI se lê como "passou". Nos gatilhos automáticos isso é o que se
      # quer (PR de quem não tem os secrets não deve quebrar); num disparo MANUAL, cujo único
      # propósito é confirmar que a credencial do CI ainda loga e que o grupo dela tem acesso,
      # o mesmo silêncio inverteria a conclusão — o verde provaria exatamente nada.
      #
      # Roda ANTES de `npm ci` e do Chromium: falha em segundos, com a causa no topo do log, em
      # vez de depois de ~3 min de provisionamento. Secrets vão por `env` (e não direto no `if`)
      # porque só o shell os enxerga de forma confiável; a comparação é por conteúdo vazio,
      # nunca pelo valor — que não pode aparecer no log.
      - name: Exigir credenciais das rotas protegidas (só no disparo manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.require_protected }}
        shell: bash
        env:
          A11Y_TEST_EMAIL: ${{ secrets.A11Y_TEST_EMAIL }}
          A11Y_TEST_PASSWORD: ${{ secrets.A11Y_TEST_PASSWORD }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          faltando=()
          [ -n "$A11Y_TEST_EMAIL" ]       || faltando+=(A11Y_TEST_EMAIL)
          [ -n "$A11Y_TEST_PASSWORD" ]    || faltando+=(A11Y_TEST_PASSWORD)
          # Os dois do Supabase entram porque o workflow cai em PLACEHOLDER quando faltam: o
          # login não completaria e a falha apareceria como erro de rede no meio do axe, longe
          # da causa real (secret ausente).
          [ -n "$VITE_SUPABASE_URL" ]     || faltando+=(VITE_SUPABASE_URL)
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || faltando+=(VITE_SUPABASE_ANON_KEY)
          if [ ${#faltando[@]} -gt 0 ]; then
            echo "::error::secret(s) ausente(s): ${faltando[*]} — as rotas protegidas seriam PULADAS e o verde não provaria nada. Cadastre em Settings → Secrets and variables → Actions, ou rode de novo com require_protected = false."
            exit 1
          fi
          echo "Credenciais presentes — as rotas protegidas serão escaneadas."

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Lockfile único na raiz do monorepo (npm workspaces).
      - name: Instalar dependências
        run: npm ci

      # Variáveis do Vite: o supabaseClient lança se VITE_SUPABASE_* faltarem.
      # As páginas públicas (login/forgot/reset) não chamam o Supabase, então
      # valores placeholder bastam. Para escanear as rotas protegidas, defina os
      # secrets reais (VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY).
      - name: Configurar .env do frontend-vite
        working-directory: apps/frontend-vite
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY || 'anon-key-placeholder' }}" >> .env

      # Baixa o Chromium + libs de sistema necessárias (--with-deps).
      - name: Instalar Chromium do Playwright
        working-directory: apps/frontend-vite
        run: npx playwright install --with-deps chromium

      # O playwright.config sobe o Vite dev sozinho (webServer). Em CI,
      # process.env.CI=true → forbidOnly e sem reuseExistingServer.
      # As rotas protegidas são puladas se os secrets de login não existirem.
      - name: Rodar testes de acessibilidade (Playwright + axe)
        working-directory: apps/frontend-vite
        env:
          A11Y_TEST_EMAIL: ${{ secrets.A11Y_TEST_EMAIL }}
          A11Y_TEST_PASSWORD: ${{ secrets.A11Y_TEST_PASSWORD }}
        run: npm run test:e2e

      # Relatório HTML do Playwright — útil para inspecionar violações no PR.
      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend-vite/playwright-report/
          retention-days: 14
