# SonarCloud — análise CI-based (rodada pelo workflow .github/workflows/sonarcloud.yml).
#
# PRÉ-REQUISITO (uma vez, no dashboard do SonarCloud):
#   Administration → Analysis Method → DESLIGAR "Automatic Analysis".
#   Enquanto o Automatic Analysis estiver ligado, o scan do CI é REJEITADO com
#   "You are running CI analysis while Automatic Analysis is enabled". No modo CI
#   o arquivo lido é ESTE (sonar-project.properties); o .sonarcloud.properties
#   (do Automatic Analysis) foi removido na migração.
#
# Verificar o organization key em SonarCloud → sua org → key (minúsculo).

sonar.projectKey=SHE-ADM_email-financeiro
sonar.organization=she-adm

# --- Código-fonte (monorepo híbrido: 3 apps Node + camada Python) ---
sonar.sources=apps/frontend-vite/src,apps/api-backend,apps/portal-next/app,packages/shared/src,server,skills,scripts
sonar.tests=apps/frontend-vite/src,apps/frontend-vite/tests,apps/frontend-vite/e2e,apps/api-backend,apps/portal-next/app,tests

# Classifica os arquivos de teste (colocados AO LADO do código em *.test.tsx /
# *.test.ts e em tests/test_*.py). O que casa aqui é removido das "sources" —
# padrão recomendado quando teste e fonte compartilham a mesma pasta. Marcar como
# TEST também evita falso positivo de regra de "main" em FIXTURE de teste (IP
# hardcoded S1313, http S5332, "secret" S2068/S6418 — ex.: tests/test_ssrf_guard.py,
# cujas fixtures SSRF são propositais).
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.a11y.test.ts,**/*.a11y.test.tsx,**/*.a11y.e2e.ts,**/tests/**,**/e2e/**,**/test_*.py

# --- Exclusões (dependências / build / gerados / inanalisáveis) ---
# supabase/migrations/** : PostgreSQL analisado com o engine PL/SQL (Oracle),
# semântica divergente ('' = NULL) → falsos positivos plsql sistemáticos; e são
# artefatos IMUTÁVEIS (proibido editar migration aplicada) — inanalisáveis por
# definição. Trade-off: bug real em migration nova fica coberto por revisão de PR
# + testes (ex.: tests/test_doc_type_domain_consistency.py).
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/build/**,**/*.min.js,**/*.d.ts,supabase/migrations/**/*

# --- Supressão por regra+arquivo (suportada no modo CI, ao contrário do
# Automatic Analysis). pythonsecurity:S8707 no CLI do extract_pdf.py é Won't Fix
# deliberado: entrada de CLI de operador confiável (a entrada não-confiável —
# boleto por link — já é guardada por _is_within_inbox/SSRF). Ver CLAUDE.md, regra 5.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=pythonsecurity:S8707
sonar.issue.ignore.multicriteria.e1.resourceKey=skills/pdf-contas-pagar/scripts/extract_pdf.py

# --- Cobertura ---
sonar.javascript.lcov.reportPaths=apps/frontend-vite/coverage/lcov.info,apps/api-backend/coverage/lcov.info,apps/portal-next/coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
# Não cobrar cobertura de testes/configs (evita "coverage on new code" enganoso).
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/tests/**,**/e2e/**,**/*.config.*,**/test_*.py,**/vite.config.*,**/vitest.config.*

sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
